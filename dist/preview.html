<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e7">
  <meta name="description" content="Превью свадебного приглашения Бекзата и Алины">
  <base href="/">
  <title>Бекзат &amp; Алина — Превью приглашения</title>
  <link rel="preload" href="assets/backgrounds/bg-01.jpg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
  <style>
    html,body{height:100%;overflow:hidden}
    .preview-site,.preview-site main,.preview-site .hero{height:100%;min-height:100%;overflow:hidden}
    .preview-site .hero-frame{min-height:100%}
    .preview-site .scroll-cue b{animation:none}
  </style>
</head>
<body>
  <div class="site preview-site">
    <main>
      <section class="hero paper-section paper-section--first" style="--bg:url('assets/backgrounds/bg-01.jpg')">
        <div class="hero-frame">
          <div class="hero-content">
            <div class="monogram" aria-hidden="true">
              <svg viewBox="0 0 120 120"><path d="M60 4 87 15 110 39 116 67 99 95 71 114 40 109 15 88 4 59 16 32 38 10Z"/><path d="M60 13 82 21 102 42 108 65 93 89 68 105 43 101 23 84 13 59 23 37 42 19Z"/></svg>
              <span>БА</span>
            </div>
            <p class="eyebrow">Приглашение на свадьбу</p>
            <h1 class="hero-names"><span>Бекзат</span><i>&amp;</i><span>Алина</span></h1>
            <div class="gold-divider" aria-hidden="true"><span></span><b>◆</b><span></span></div>
            <p class="hero-date">12 июня 2027 г.</p>
          </div>
          <div class="scroll-cue" aria-hidden="true"><span>Листайте вниз</span><b>⌄</b></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
